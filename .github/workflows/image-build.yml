name: Build Vintage Story Docker image
run-name: >-
  Build ${{ github.event.inputs.release_type || github.event.client_payload.release_type || 'manual' }}
  ${{ github.event.inputs.version || github.event.client_payload.version || '' }}
  [${{ github.event.inputs.request_id || github.event.client_payload.request_id || 'manual' }}]

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - unstable
          - pre
      version:
        description: "Game version MAJOR.MINOR.PATCH"
        required: true
      minor_version:
        description: "Game version MAJOR.MINOR (only stable version)"
        required: false
      request_id:
        description: "External request id"
        required: false
  repository_dispatch:
    types:
      - vintagestory-release

jobs:
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve build parameters
        id: params
        shell: bash
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type || github.event.client_payload.release_type }}
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
          MINOR_VERSION: ${{ github.event.inputs.minor_version || github.event.client_payload.minor_version }}
          REQUEST_ID: ${{ github.event.inputs.request_id || github.event.client_payload.request_id }}
        run: |
          if [[ -z "$RELEASE_TYPE" || -z "$VERSION" ]]; then
            echo "release_type and version are required" >&2
            exit 1
          fi

          if [[ "$RELEASE_TYPE" == "stable" && -z "$MINOR_VERSION" ]]; then
            MINOR_VERSION="$(printf '%s' "$VERSION" | cut -d. -f1,2)"
          fi

          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor_version=$MINOR_VERSION" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Detect required .NET runtime
        id: dotnet-runtime
        run: |
          chmod +x scripts/detect-dotnet-runtime.sh
          rm -rf .server-package/server
          mkdir -p .server-package/server
          archive_path="${RUNNER_TEMP}/vs_server_linux-x64_${{ steps.params.outputs.version }}.tar.gz"
          wget -q -O "$archive_path" "https://cdn.vintagestory.at/gamefiles/${{ steps.params.outputs.release_type }}/vs_server_linux-x64_${{ steps.params.outputs.version }}.tar.gz"
          tar -xzf "$archive_path" -C .server-package/server
          runtime_version="$(scripts/detect-dotnet-runtime.sh .server-package/server)"
          echo "runtime_version=${runtime_version}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (stable)
        if: ${{ steps.params.outputs.release_type == 'stable' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.params.outputs.version }}
            DOTNET_RUNTIME_VERSION=${{ steps.dotnet-runtime.outputs.runtime_version }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ steps.params.outputs.release_type }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ steps.params.outputs.minor_version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ steps.params.outputs.version }}

      - name: Build and push (unstable)
        if: ${{ steps.params.outputs.release_type == 'unstable' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.params.outputs.version }}
            DOTNET_RUNTIME_VERSION=${{ steps.dotnet-runtime.outputs.runtime_version }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ steps.params.outputs.release_type }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ steps.params.outputs.version }}

      - name: Build and push (pre)
        if: ${{ steps.params.outputs.release_type == 'pre' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.params.outputs.version }}
            DOTNET_RUNTIME_VERSION=${{ steps.dotnet-runtime.outputs.runtime_version }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:unstable
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ steps.params.outputs.version }}
