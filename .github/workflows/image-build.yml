name: Build Vintage Story Docker image

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - unstable
          - pre
      version:
        description: "Game version MAJOR.MINOR.PATCH"
        required: true
      minor_version:
        description: "Game version MAJOR.MINOR (only stable version)"
        required: false

jobs:
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect required .NET runtime
        id: dotnet-runtime
        run: |
          chmod +x scripts/detect-dotnet-runtime.sh
          rm -rf .server-package/server
          mkdir -p .server-package/server
          archive_path="${RUNNER_TEMP}/vs_server_linux-x64_${{ github.event.inputs.version }}.tar.gz"
          wget -q -O "$archive_path" "https://cdn.vintagestory.at/gamefiles/${{ github.event.inputs.release_type }}/vs_server_linux-x64_${{ github.event.inputs.version }}.tar.gz"
          tar -xzf "$archive_path" -C .server-package/server
          runtime_version="$(scripts/detect-dotnet-runtime.sh .server-package/server)"
          echo "runtime_version=${runtime_version}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (stable)
        if: ${{ github.event.inputs.release_type == 'stable' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.event.inputs.version }}
            DOTNET_RUNTIME_VERSION=${{ steps.dotnet-runtime.outputs.runtime_version }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ github.event.inputs.release_type }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ github.event.inputs.minor_version }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ github.event.inputs.version }}

      - name: Build and push (unstable)
        if: ${{ github.event.inputs.release_type == 'unstable' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.event.inputs.version }}
            DOTNET_RUNTIME_VERSION=${{ steps.dotnet-runtime.outputs.runtime_version }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ github.event.inputs.release_type }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ github.event.inputs.version }}

      - name: Build and push (pre)
        if: ${{ github.event.inputs.release_type == 'pre' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.event.inputs.version }}
            DOTNET_RUNTIME_VERSION=${{ steps.dotnet-runtime.outputs.runtime_version }}
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:unstable
            ${{ secrets.DOCKER_HUB_USERNAME }}/vintagestory:${{ github.event.inputs.version }}
